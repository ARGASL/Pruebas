<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J&L Abogados | Precisión Legal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde-primario: #004d43; 
            --verde-hover: #006357;
            --blanco: #ffffff;
            --gris-fondo: #f9f9f9;
            --negro-footer: #0a0a0a;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; color: #333; background: var(--blanco); scroll-behavior: smooth; }

        /* NAVEGACIÓN */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: var(--verde-primario);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-box img { height: 45px; }
        .nav-links a {
            text-decoration: none;
            color: var(--blanco);
            margin-left: 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* HERO */
        .hero {
            padding: 140px 8%;
            background: linear-gradient(rgba(0, 77, 67, 0.85), rgba(0, 77, 67, 0.85)), 
                        url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            color: var(--blanco);
        }
        .hero h1 { font-family: 'Montserrat', sans-serif; font-size: 3rem; margin: 0; }
        .hero p { font-size: 1.2rem; margin-top: 20px; border-left: 3px solid var(--blanco); padding-left: 20px; opacity: 0.9; }

        /* ÁREAS DE PRÁCTICA (8 ÁREAS) */
        .areas-section { padding: 80px 8%; background: var(--blanco); }
        .section-title { text-align: center; font-family: 'Montserrat', sans-serif; margin-bottom: 50px; color: var(--verde-primario); font-size: 2rem; }
        
        .grid-areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #eee; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); border-color: var(--verde-primario); }
        .card-img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 20px; }
        .card-body h3 { font-family: 'Montserrat', sans-serif; color: var(--verde-primario); margin: 0; font-size: 1rem; text-transform: uppercase; }

        /* EXPERIENCIA INTERACTIVA */
        .experiencia-interactiva { padding: 80px 8%; background: var(--gris-fondo); }
        .exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        
        .clientes-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
