<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | J&L Abogados</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #f4f7f6; }
        nav { background: #004d43; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; }
        
        .contact-container { max-width: 600px; margin: 80px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #004d43; font-family: 'Montserrat'; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; background: #004d43; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #00332c; }
    </style>
</head>
<body>

    <nav>
        <span style="color: white; font-weight: 700;">J&L ABOGADOS</span>
        <a href="index.html">Volver al Inicio</a>
    </nav>

    <div class="contact-container">
        <h1>Contáctenos</h1>
        <form>
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Mensaje</label>
                <textarea rows="5" placeholder="¿En qué podemos ayudarle?"></textarea>
            </div>
            <button type="submit">Enviar Consulta</button>
        </form>
    </div>

</body>
</html>
